onboarding = false

[keys]
prefix = "ctrl+space"

# General
detach = "prefix+d"
reload_config = "prefix+q"

# Panes
split_horizontal = "prefix+h"
split_vertical = "prefix+v"
close_pane = "prefix+x"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# Tabs (tmux windows)
rename_tab = "prefix+r"
new_tab = "prefix+c"
close_tab = "prefix+k"
switch_tab = "alt+1..9"

# Workspaces (tmux sessions)
rename_workspace = "prefix+shift+r"
new_workspace = "prefix+shift+c"
close_workspace = "prefix+shift+k"
previous_workspace = "alt+up"
next_workspace = "alt+down"

[ui]
pane_borders = "auto"
pane_outer_borders = false

[theme]
name = "nord"
